<!DOCTYPE html>
<html>
<head>
<title>Centered Buttons Moving Box</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:white;
}

/* Center buttons */
.controls{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
}

button{
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}

/* Moving box */
.box{
    width:100px;
    height:100px;
    border:2px solid black;
    position:absolute;
    top:0;
    left:0;
    background:red;
}

/* Start animation */
.run{
    animation:
        moveBox 8s linear infinite,
        colorFade 8s linear infinite;
}

/* Movement */
@keyframes moveBox{

    0%{
        top:0;
        left:0;
    }

    25%{
        top:0;
        left:calc(100vw - 100px);
    }

    50%{
        top:calc(100vh - 100px);
        left:calc(100vw - 100px);
    }

    75%{
        top:calc(100vh - 100px);
        left:0;
    }

    100%{
        top:0;
        left:0;
    }
}

/* Color + fade */
@keyframes colorFade{

    0%{ background:red; opacity:1; }
    25%{ background:blue; opacity:0.6; }
    50%{ background:green; opacity:1; }
    75%{ background:orange; opacity:0.5; }
    100%{ background:red; opacity:1; }
}

</style>
</head>

<body>

<div class="controls">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</div>

<div class="box"></div>

<script>

$(document).ready(function(){

    $("#start").click(function(){
        $(".box").removeClass("run"); // reset fix
        void document.querySelector(".box").offsetWidth; // force restart animation
        $(".box").addClass("run");
    });

    $("#stop").click(function(){
        $(".box").removeClass("run");
    });

});

</script>

</body>
</html>
