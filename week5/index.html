<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f5f7fa;
      }

      .container {
        max-width: 1200px;
        margin: 50px auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        padding: 20px;
      }

      .contact-info,
      .contact-form {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-bottom: 20px;
        color: #222;
      }

      .info-item {
        margin-bottom: 20px;
      }

      .info-item h3 {
        margin-bottom: 5px;
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .contact-form textarea {
        resize: none;
        height: 140px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        background: #007bff;
        color: white;
      }

      button:hover {
        background: #0056b3;
      }

      #success {
        margin-top: 15px;
        color: green;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="contact-info">
        <h1>Contact Us</h1>

        <div class="info-item">
          <h3>📍 Address</h3>
          <p>123 Business Street, New York, USA</p>
        </div>

        <div class="info-item">
          <h3>📞 Phone</h3>
          <p>+1 (555) 123-4567</p>
        </div>

        <div class="info-item">
          <h3>✉️ Email</h3>
          <p>support@company.com</p>
        </div>

        <div class="info-item">
          <h3>🕒 Business Hours</h3>
          <p>Mon - Fri: 9:00 AM - 6:00 PM</p>
        </div>
      </div>

      <div class="contact-form">
        <h1>Send a Message</h1>

        <form id="contactForm">
          <input type="text" id="name" placeholder="Your Name" required />

          <input type="email" id="email" placeholder="Your Email" required />

          <input type="text" id="subject" placeholder="Subject" required />

          <textarea id="message" placeholder="Your Message" required></textarea>

          <button type="submit">Send Message</button>

          <p id="success"></p>
        </form>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
