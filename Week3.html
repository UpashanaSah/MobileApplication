<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>
<body>

<h1>Lets Do Some Operations</h1>

<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">

<br><br>

<button onclick="calculate('add')">Addition</button>
<button onclick="calculate('subtract')">Subtraction</button>
<button onclick="calculate('multiply')">Multiplication</button>
<button onclick="calculate('divide')">Division</button>
4

    
<h2 id="result"></h2>

<script>

function calculate(operation) {

    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    var result;

    if (operation === "add") {
        result = num1 + num2;
    }
    else if (operation === "subtract") {
        result = num1 - num2;
    }
    else if (operation === "multiply") {
        result = num1 * num2;
    }
    else if (operation === "divide") {

        if (num2 !== 0) {
            result = num1 / num2;
        } 
        else {
            document.getElementById("result").innerHTML = "Error: Division by zero is not allowed.";
            return;
        }

    }

    document.getElementById("result").innerHTML = "Result: " + result;

}

</script>

</body>
</html>
