<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            margin-bottom:20px;
        }

        input{
            padding:10px;
            margin:10px;
            width:200px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            padding:10px 15px;
            margin:5px;
            border:none;
            border-radius:5px;
            background:#007BFF;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #result{
            margin-top:20px;
            color:#333;
        }
    </style>

</head>

<body>

<div class="container">

<h1>Simple Calculator</h1>

<input type="number" id="num1" placeholder="Enter first number"><br>
<input type="number" id="num2" placeholder="Enter second number">

<br><br>

<button onclick="add()">Addition</button>
<button onclick="subtract()">Subtraction</button>
<button onclick="multiply()">Multiplication</button>
<button onclick="divide()">Division</button>

<h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
